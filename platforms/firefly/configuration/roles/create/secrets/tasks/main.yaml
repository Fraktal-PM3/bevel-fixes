# This role syncs Fabric MSP credentials from Vault to Kubernetes secrets
# The MSP was created during Fabric network deployment and stored in Vault
# We create a secret with the __ naming convention that the FabConnect init container expects

# Set facts for Vault path
- name: Set Vault MSP path for organization
  set_fact:
    vault_msp_path: "{{ vault.secret_path }}/local{{ component }}/users/admin-msp"
    secret_name: "fabconnect-msp"

# Fetch MSP components from Vault
- name: Fetch admincerts from Vault
  shell: |
    export VAULT_ADDR="{{ vault.url }}"
    export VAULT_TOKEN="{{ vault.root_token }}"
    vault kv get -field=admincerts "{{ vault_msp_path }}"
  register: admincerts
  ignore_errors: yes

- name: Fetch cacerts from Vault
  shell: |
    export VAULT_ADDR="{{ vault.url }}"
    export VAULT_TOKEN="{{ vault.root_token }}"
    vault kv get -field=cacerts "{{ vault_msp_path }}"
  register: cacerts
  ignore_errors: yes

- name: Fetch keystore from Vault
  shell: |
    export VAULT_ADDR="{{ vault.url }}"
    export VAULT_TOKEN="{{ vault.root_token }}"
    vault kv get -field=keystore "{{ vault_msp_path }}"
  register: keystore
  ignore_errors: yes

- name: Fetch signcerts from Vault
  shell: |
    export VAULT_ADDR="{{ vault.url }}"
    export VAULT_TOKEN="{{ vault.root_token }}"
    vault kv get -field=signcerts "{{ vault_msp_path }}"
  register: signcerts
  ignore_errors: yes

- name: Fetch tlscacerts from Vault
  shell: |
    export VAULT_ADDR="{{ vault.url }}"
    export VAULT_TOKEN="{{ vault.root_token }}"
    vault kv get -field=tlscacerts "{{ vault_msp_path }}"
  register: tlscacerts
  ignore_errors: yes

# Create temporary directory for MSP files
- name: Create temporary directory for MSP
  tempfile:
    state: directory
    suffix: msp
  register: temp_msp_dir

# Write MSP files to temporary directory
- name: Write admincerts to file
  copy:
    content: "{{ admincerts.stdout }}"
    dest: "{{ temp_msp_dir.path }}/admincerts__cert.pem"
  when: admincerts.rc == 0

- name: Write cacerts to file
  copy:
    content: "{{ cacerts.stdout }}"
    dest: "{{ temp_msp_dir.path }}/cacerts__ca.pem"
  when: cacerts.rc == 0

- name: Write keystore to file
  copy:
    content: "{{ keystore.stdout }}"
    dest: "{{ temp_msp_dir.path }}/keystore__key.pem"
  when: keystore.rc == 0

- name: Write signcerts to file
  copy:
    content: "{{ signcerts.stdout }}"
    dest: "{{ temp_msp_dir.path }}/signcerts__cert.pem"
  when: signcerts.rc == 0

- name: Write tlscacerts to file
  copy:
    content: "{{ tlscacerts.stdout }}"
    dest: "{{ temp_msp_dir.path }}/tlscacerts__tlsca.pem"
  when: tlscacerts.rc == 0

# Delete existing secret if it exists
- name: Delete existing fabconnect-msp secret
  k8s:
    api_version: v1
    kind: Secret
    name: "{{ secret_name }}"
    namespace: "{{ component_ns }}"
    state: absent
    kubeconfig: "{{ kubernetes.config_file }}"
  ignore_errors: yes

# Create Kubernetes secret from MSP files
- name: Create fabconnect-msp secret in Kubernetes
  shell: |
    kubectl create secret generic {{ secret_name }} \
      --from-file={{ temp_msp_dir.path }}/admincerts__cert.pem \
      --from-file={{ temp_msp_dir.path }}/cacerts__ca.pem \
      --from-file={{ temp_msp_dir.path }}/keystore__key.pem \
      --from-file={{ temp_msp_dir.path }}/signcerts__cert.pem \
      --from-file={{ temp_msp_dir.path }}/tlscacerts__tlsca.pem \
      --namespace {{ component_ns }} \
      --kubeconfig {{ kubernetes.config_file }}
  when:
    - admincerts.rc == 0
    - cacerts.rc == 0
    - keystore.rc == 0
    - signcerts.rc == 0

# Cleanup temporary directory
- name: Remove temporary MSP directory
  file:
    path: "{{ temp_msp_dir.path }}"
    state: absent
