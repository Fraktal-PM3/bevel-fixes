# This role creates Helm values for FireFly deployment
# Each organization gets a unique FireFly instance with its own ingress URL

# Create FireFly HelmRelease manifest
- name: Create FireFly HelmRelease manifest
  template:
    src: "firefly-release.yaml.j2"
    dest: "{{ values_dir }}/{{ component }}/firefly.yaml"

# Git Push: Push the generated values file to GitOps repository
- name: Git Push - FireFly values
  include_role:
    name: "{{ playbook_dir }}/../../shared/configuration/roles/git_push"
  vars:
    GIT_DIR: "{{ playbook_dir }}/../../../"
    msg: "[ci skip] Pushing FireFly deployment files for {{ component }}"

# Wait for FireFly pods to be running
- name: "Waiting for FireFly pod in {{ component_ns }}"
  include_role:
    name: "{{ playbook_dir }}/../../shared/configuration/roles/check/helm_component"
  vars:
    component_type: "Pod"
    namespace: "{{ component_ns }}"
    component_name: "firefly"
    label_selectors:
      - app.kubernetes.io/name = firefly

# Post-deployment validation: Verify identity enrollment
- name: "Verify Fabric identity enrollment for {{ component }}"
  kubernetes.core.k8s_exec:
    namespace: "{{ component_ns }}"
    pod: "{{ lookup('kubernetes.core.k8s', kind='Pod', namespace=component_ns, label_selector='app.kubernetes.io/name=firefly-fabconnect').metadata.name }}"
    command: >
      curl -sf http://localhost:3000/identities/{{ firefly_config.fabconnect_signer }}
  register: identity_check
  retries: 5
  delay: 10
  until: identity_check.rc == 0
  ignore_errors: yes

- name: "Display identity enrollment status"
  debug:
    msg: "Identity '{{ firefly_config.fabconnect_signer }}' enrollment status: {{ 'SUCCESS' if identity_check.rc == 0 else 'FAILED' }}"

# Post-deployment validation: Check multiparty organization registration
- name: "Verify FireFly multiparty organization for {{ component }}"
  kubernetes.core.k8s_exec:
    namespace: "{{ component_ns }}"
    pod: "{{ lookup('kubernetes.core.k8s', kind='Pod', namespace=component_ns, label_selector='app.kubernetes.io/name=firefly').metadata.name }}"
    command: >
      curl -sf http://localhost:5000/api/v1/network/organizations
  register: org_check
  retries: 5
  delay: 10
  until: org_check.rc == 0
  ignore_errors: yes

- name: "Display organization registration status"
  debug:
    msg: "Organization registration check: {{ 'SUCCESS' if org_check.rc == 0 else 'FAILED' }}"

# Post-deployment validation: Check node registration
- name: "Verify FireFly node registration for {{ component }}"
  kubernetes.core.k8s_exec:
    namespace: "{{ component_ns }}"
    pod: "{{ lookup('kubernetes.core.k8s', kind='Pod', namespace=component_ns, label_selector='app.kubernetes.io/name=firefly').metadata.name }}"
    command: >
      curl -sf http://localhost:5000/api/v1/network/nodes
  register: node_check
  retries: 5
  delay: 10
  until: node_check.rc == 0
  ignore_errors: yes

- name: "Display node registration status"
  debug:
    msg: "Node registration check: {{ 'SUCCESS' if node_check.rc == 0 else 'FAILED' }}"

- name: "FireFly deployment validation complete"
  debug:
    msg: |
      FireFly deployment for {{ component }} validation summary:
        - Identity Enrolled: {{ 'YES' if identity_check.rc == 0 else 'NO' }}
        - Organization Registered: {{ 'YES' if org_check.rc == 0 else 'NO' }}
        - Node Registered: {{ 'YES' if node_check.rc == 0 else 'NO' }}
