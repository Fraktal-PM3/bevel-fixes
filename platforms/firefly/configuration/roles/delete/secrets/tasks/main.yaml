# This role deletes Kubernetes secrets for FireFly

- name: Delete secret
  k8s:
    api_version: v1
    kind: Secret
    name: "{{ secret_name }}"
    namespace: "{{ component_ns }}"
    state: absent
    kubeconfig: "{{ kubernetes.config_file }}"
  ignore_errors: yes
