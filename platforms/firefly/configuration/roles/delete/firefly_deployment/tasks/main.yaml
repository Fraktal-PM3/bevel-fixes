# This role removes FireFly values files from the GitOps repository
# This triggers Flux to delete the Helm releases

- name: Check if FireFly values directory exists
  stat:
    path: "{{ values_dir }}/firefly"
  register: firefly_dir

- name: Remove FireFly values directory
  file:
    path: "{{ values_dir }}/firefly"
    state: absent
  when: firefly_dir.stat.exists

# Git Push: Remove the values files from GitOps repository
- name: Git Push - Remove FireFly values
  include_role:
    name: "{{ playbook_dir }}/../../shared/configuration/roles/git_push"
  vars:
    GIT_DIR: "{{ playbook_dir }}/../../../"
    msg: "[ci skip] Removing FireFly deployment files for {{ component }}"
  when: firefly_dir.stat.exists
