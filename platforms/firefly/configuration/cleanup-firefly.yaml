# This playbook removes FireFly deployments from all organizations
# It cleans up FireFly resources while preserving the Fabric network

- hosts: ansible_provisioners
  gather_facts: no
  no_log: "{{ no_ansible_log | default(false) }}"
  tasks:

    # Delete FireFly Helm releases via GitOps
    # Remove the values files so Flux will delete the Helm releases
    - name: Remove FireFly values files from GitOps repository
      include_role:
        name: "delete/firefly_deployment"
      vars:
        component_ns: "{{ org.name | lower }}-net"
        component: "{{ org.name | lower }}"
        gitops: "{{ org.gitops }}"
        values_dir: "{{playbook_dir}}/../../../{{org.gitops.release_dir}}/{{ org.name | lower }}"
      loop: "{{ network['organizations'] }}"
      loop_control:
        loop_var: org
      when:
        - org.firefly_config is defined
        - org.firefly_config.enabled == true

    # Delete Kubernetes resources directly (faster than waiting for Flux)
    - name: Delete FireFly Kubernetes resources
      include_role:
        name: "delete/k8s_resources"
      vars:
        component_ns: "{{ org.name | lower }}-net"
        component: "{{ org.name | lower }}"
        kubernetes: "{{ org.k8s }}"
        resource_types:
          - statefulset
          - deployment
          - service
          - ingress
          - configmap
          - pvc
        label_selector: "app.kubernetes.io/instance=firefly"
      loop: "{{ network['organizations'] }}"
      loop_control:
        loop_var: org
      when:
        - org.firefly_config is defined
        - org.firefly_config.enabled == true

    # Delete MSP secrets
    - name: Delete fabconnect-msp secrets
      include_role:
        name: "delete/secrets"
      vars:
        component_ns: "{{ org.name | lower }}-net"
        kubernetes: "{{ org.k8s }}"
        secret_name: "fabconnect-msp"
      loop: "{{ network['organizations'] }}"
      loop_control:
        loop_var: org
      when:
        - org.firefly_config is defined
        - org.firefly_config.enabled == true

  vars:
    privilege_escalate: false
    install_os: "linux"
    install_arch: "amd64"
    bin_install_dir: "~/bin"
