apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaincode-install-ombud2-peer0-pm3package-2
  namespace: ombud2-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: chaincode-install-ombud2-peer0-pm3package-2
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-local
        namespace: flux-local
      chart: platforms/hyperledger-fabric/charts/fabric-chaincode-install
  values:
    metadata:
      namespace: ombud2-net
      network:
        version: 2.5.4
      images:
        fabrictools: ghcr.io/hyperledger/bevel-fabric-tools:2.5.4
        alpineutils: ghcr.io/hyperledger/bevel-alpine:latest

    peer:
      name: peer0
      address: peer0.ombud2-net:7051
      localmspid: ombud2MSP
      loglevel: debug
      tlsstatus: true
    vault:
      role: vault-role
      address: http://192.168.49.1:8200
      authpath: localombud2
      adminsecretprefix: secretsv2/data/localombud2/users/admin
      secretgitprivatekey: secretsv2/data/localombud2/credentials/ombud2-net/git
      serviceaccountname: vault-auth
      type: hashicorp
      imagesecretname: ""
      tls: false
    chaincode:
      builder: hyperledger/fabric-ccenv:2.5.4
      name: pm3package
      version: 2
      lang: node
      maindirectory: .
      repository:
        hostname: "github.com"
        git_username: "Fraktal-PM3"
        url: github.com/Fraktal-PM3/fraktal.git
        branch: main
        path: chaincodes/package/
      endorsementpolicies:  ''
