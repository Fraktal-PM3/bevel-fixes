apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefly
  namespace: pm3org-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: firefly
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-local
        namespace: flux-local
      chart: firefly-helm-charts/charts/firefly
  values:
    config:
      # Enable debug and admin APIs
      debugEnabled: true
      adminEnabled: true

      # Organization configuration
      organizationName: "pm3org"
      organizationKey: "pm3org"

      # Set Fabric as the default blockchain
      defaultBlockchainType: "fabric"

      # FabConnect configuration
      fabconnectUrl: ""  # Auto-discovered from subchart
      fabconnectChannel: "pm3"
      fabconnectChaincode: "firefly-go"
      # Use organization name as signer (matches official FireFly pattern)
      fabconnectSigner: "pm3org"
      fabconnectRetry: True

      # Database configuration (auto-configured with built-in PostgreSQL)
      postgresAutomigrate: True

      # Multiparty configuration
      multipartyEnabled: True

      # Configure FireFly contracts with starting block
      # This ensures all nodes, regardless of when they join, start from the same block
      fireflyContracts:
        - chaincode: "firefly-go"
          channel: "pm3"
          firstEvent: "0"

    # Data exchange configuration for peer-to-peer communication
    dataexchange:
      enabled: True

      certificate:
        enabled: true
        issuerRef:
          kind: ClusterIssuer
          name: selfsigned-ca

      tlsSecret:
        enabled: false

    # FabConnect subchart configuration
    fabconnect:
      enabled: true

      image:
        tag: "latest"

      # FabConnect configuration
      config:
        # Enable automatic identity enrollment
        autoEnrollIdentity: "pm3org"

      # Fabric network connection details
      fabric:
        peerUrl: "grpcs://peer0.pm3org-net.pm3fraktal.se:443"
        ordererUrl: "grpcs://orderer1.pm3org-net.pm3fraktal.se:443"
        caUrl: "https://ca.pm3org-net.pm3fraktal.se:443"

        # Organization details
        organizationName: "pm3org-net"
        organizationMspId: "pm3orgMSP"

        # Channel and chaincode
        channelName: "pm3"
        chaincodeName: "firefly-go"

        # CA enrollment credentials
        enrollId: "pm3org-admin"
        enrollSecret: "pm3org-adminpw"

      # MSP secret configuration
      msp:
        secretName: "fabconnect-msp"
        mountPath: "/etc/firefly/organizations"

      # Service configuration
      service:
        type: ClusterIP
        port: 3000

      # Resource allocation
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi

      # Persistent storage
      persistentVolume:
        accessModes:
          - ReadWriteOnce
        size: 5Gi
        storageClass: ""

      # Health check configuration
      healthcheck:
        enabled: true
        initialDelaySeconds: 15

      # Logging
      log:
        level: "info"

    # Core FireFly pod configuration
    core:
      enabled: true

      ingress:
        enabled: true
        className: "haproxy"
        annotations:
          external-dns.alpha.kubernetes.io/hostname: firefly.pm3org-net.pm3fraktal.se
          external-dns.alpha.kubernetes.io/target: 46.62.234.169
        hosts:
          - host: firefly.pm3org-net.pm3fraktal.se
        tls: []

    # Sandbox UI
    sandbox:
      enabled: True

      # Separate ingress for sandbox
      ingress:
        enabled: true
        className: "haproxy"
        annotations:
          external-dns.alpha.kubernetes.io/hostname: sandbox.firefly.pm3org-net.pm3fraktal.se
          external-dns.alpha.kubernetes.io/target: 46.62.234.169
        hosts:
          - host: sandbox.firefly.pm3org-net.pm3fraktal.se
        tls: []

    # PostgreSQL
    postgres:
      enabled: true

    # IPFS
    ipfs:
      enabled: True
      swarmSecretName: "ipfs-swarm-key"
      peers: []
