{{- if .Values.ipfs.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "firefly.fullname" . }}-ipfs
  labels:
    {{- include "firefly.ipfsLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "firefly.fullname" . }}-ipfs
  replicas: 1
  selector:
    matchLabels:
      {{- include "firefly.ipfsSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.ipfs.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "firefly.ipfsSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.ipfs.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.ipfs.podSecurityContext | nindent 8 }}
      initContainers:
      - name: init-ipfs
        image: "{{ .Values.ipfs.image.repository }}:{{ .Values.ipfs.image.tag }}"
        imagePullPolicy: {{ .Values.ipfs.image.pullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          if [ ! -f /data/ipfs/config ]; then
            ipfs init --profile={{ .Values.ipfs.profile }}
            ipfs config Addresses.API /ip4/0.0.0.0/tcp/5001
            ipfs config Addresses.Gateway /ip4/0.0.0.0/tcp/8080

            # Clear default bootstrap nodes for private network
            ipfs bootstrap rm --all

            # Enable mDNS for local peer discovery in private network
            ipfs config --json Discovery.MDNS.Enabled true

            {{- if .Values.ipfs.swarmSecretName }}
            # Clear address filters for private network in Kubernetes
            # Default filters block private IP ranges (10.x.x.x, 172.16.x.x, 192.168.x.x)
            # which prevents IPFS nodes from connecting within the cluster
            ipfs config --json Swarm.AddrFilters '[]'
            {{- end }}

            {{- if .Values.ipfs.peers }}
            # Add static peering configuration for private network
            # Note: Peers list should contain full multiaddrs with peer IDs
            # Example: /dns4/firefly-ipfs.namespace.svc.cluster.local/tcp/4001/p2p/12D3KooW...
            echo '{"Peers": [' > /tmp/peers.json
            {{- $last := last .Values.ipfs.peers }}
            {{- range .Values.ipfs.peers }}
            echo '{"Addrs": ["{{ . }}"]}{{ if ne . $last }},{{ end }}' >> /tmp/peers.json
            {{- end }}
            echo ']}' >> /tmp/peers.json
            ipfs config --json Peering "$(cat /tmp/peers.json)"
            rm /tmp/peers.json
            {{- end }}
          fi
        volumeMounts:
        - name: ipfs-data
          mountPath: /data/ipfs
        - name: swarm-key
          mountPath: /data/ipfs/swarm.key
          subPath: swarm.key
          readOnly: true
      containers:
      - name: ipfs
        securityContext:
          {{- toYaml .Values.ipfs.securityContext | nindent 10 }}
        image: "{{ .Values.ipfs.image.repository }}:{{ .Values.ipfs.image.tag }}"
        imagePullPolicy: {{ .Values.ipfs.image.pullPolicy }}
        command: ["ipfs", "daemon", "--migrate"]
        ports:
        - name: api
          containerPort: 5001
          protocol: TCP
        - name: gateway
          containerPort: 8080
          protocol: TCP
        - name: swarm
          containerPort: 4001
          protocol: TCP
        {{- with .Values.ipfs.extraEnv }}
        env:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        livenessProbe:
          exec:
            command:
            - ipfs
            - --api=/ip4/127.0.0.1/tcp/5001
            - dag
            - stat
            - /ipfs/QmUNLLsPACCz1vLxQVkXqqLX5R1X345qqfHbsf67hvA3Nn
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - ipfs
            - --api=/ip4/127.0.0.1/tcp/5001
            - dag
            - stat
            - /ipfs/QmUNLLsPACCz1vLxQVkXqqLX5R1X345qqfHbsf67hvA3Nn
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - ipfs
            - --api=/ip4/127.0.0.1/tcp/5001
            - dag
            - stat
            - /ipfs/QmUNLLsPACCz1vLxQVkXqqLX5R1X345qqfHbsf67hvA3Nn
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        volumeMounts:
        - name: ipfs-data
          mountPath: /data/ipfs
        - name: swarm-key
          mountPath: /data/ipfs/swarm.key
          subPath: swarm.key
          readOnly: true
        resources:
          {{- toYaml .Values.ipfs.resources | nindent 10 }}
      {{- with .Values.ipfs.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ipfs.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ipfs.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.ipfs.swarmSecretName }}
      volumes:
      - name: swarm-key
        secret:
          secretName: {{ .Values.ipfs.swarmSecretName }}
          optional: false
{{- end }}
  volumeClaimTemplates:
  - metadata:
      name: ipfs-data
      {{- with .Values.ipfs.persistentVolume.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      accessModes:
        {{- toYaml .Values.ipfs.persistentVolume.accessModes | nindent 8 }}
      {{- if .Values.ipfs.persistentVolume.storageClass }}
      storageClassName: {{ .Values.ipfs.persistentVolume.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.ipfs.persistentVolume.size }}
{{- end }}
