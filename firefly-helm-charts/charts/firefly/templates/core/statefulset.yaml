apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "firefly.fullname" . }}
  labels:
    {{- include "firefly.coreLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "firefly.fullname" . }}
  updateStrategy:
    type: RollingUpdate
  replicas: 1
  selector:
    matchLabels:
      {{- include "firefly.coreSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/core/secret.yaml") . | sha256sum }}
        {{- with .Values.core.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "firefly.coreSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.core.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.core.podSecurityContext | nindent 8 }}
      {{- if or .Values.core.initContainers (and .Values.fabconnect.enabled .Values.fabconnect.config.autoEnrollIdentity (ne .Values.fabconnect.config.autoEnrollIdentity "")) }}
      initContainers:
        {{- if and .Values.fabconnect.enabled .Values.fabconnect.config.autoEnrollIdentity (ne .Values.fabconnect.config.autoEnrollIdentity "") }}
        - name: wait-for-identity
          image: curlimages/curl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              FABCONNECT_URL="http://{{ include "firefly.fullname" . }}-fabconnect.{{ .Release.Namespace }}.svc:{{ .Values.fabconnect.service.port }}"
              IDENTITY_NAME="{{ tpl .Values.fabconnect.config.autoEnrollIdentity . }}"

              echo "Waiting for identity '$IDENTITY_NAME' to be enrolled..."
              MAX_RETRIES=120
              RETRY_COUNT=0
              until curl -sf $FABCONNECT_URL/identities/$IDENTITY_NAME > /dev/null 2>&1; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                  echo "ERROR: Identity '$IDENTITY_NAME' was not enrolled after $MAX_RETRIES attempts"
                  echo "Please check the enrollment job logs"
                  exit 1
                fi
                echo "Identity not ready yet, waiting... (attempt $RETRY_COUNT/$MAX_RETRIES)"
                sleep 5
              done
              echo "Identity '$IDENTITY_NAME' is enrolled and ready!"
        {{- end }}
        {{- if .Values.core.initContainers }}
        {{- tpl .Values.core.initContainers . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: firefly
          securityContext:
            {{- toYaml .Values.core.securityContext | nindent 12 }}
          image: "{{ .Values.core.image.repository }}:{{ .Values.core.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.core.image.pullPolicy }}
          env:
            {{- if .Values.core.extraEnv }}
            {{- toYaml .Values.core.extraEnv | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.core.service.httpPort }}
              protocol: TCP
            {{- if .Values.config.debugEnabled }}
            - name: debug
              containerPort: {{ .Values.core.service.debugPort }}
              protocol: TCP
            {{- end }}
            {{- if .Values.config.adminEnabled }}
            - name: admin
              containerPort: {{ .Values.core.service.adminPort }}
              protocol: TCP
            {{- end }}
            {{- if .Values.config.metricsEnabled }}
            - name: metrics
              containerPort: {{ .Values.core.service.metricsPort }}
              protocol: TCP
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: {{ if and .Values.config.adminEnabled .Values.config.preInit }}admin{{ else }}http{{ end }}
            initialDelaySeconds: 10
            failureThreshold: 5
            successThreshold: 1
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: {{ if and .Values.config.adminEnabled .Values.config.preInit }}admin{{ else }}http{{ end }}
            failureThreshold: 10
            successThreshold: 3
            periodSeconds: 3
          volumeMounts:
            - mountPath: /etc/firefly/
              name: firefly-config
            {{- if .Values.core.extraVolumeMounts }}
            {{- tpl .Values.core.extraVolumeMounts . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.core.resources | nindent 12 }}
      {{- if .Values.core.extraContainers }}
        {{- tpl .Values.core.extraContainers . | nindent 8 }}
      {{- end }}
      {{- with .Values.core.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.core.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.core.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: firefly-config
          secret:
            secretName: {{ include "firefly.fullname" . }}-config
      {{- if .Values.core.extraVolumes }}
        {{- tpl .Values.core.extraVolumes . | nindent 8 }}
      {{- end }}
  {{- if .Values.core.volumeClaimTemplates }}
  volumeClaimTemplates:
    {{- tpl .Values.core.volumeClaimTemplates . | nindent 4 }}
  {{- end }}
