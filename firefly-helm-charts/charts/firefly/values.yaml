# IPFS configuration
# When enabled, deploys an IPFS node for shared storage
ipfs:
  enabled: true

  image:
    repository: ipfs/kubo
    pullPolicy: IfNotPresent
    tag: "v0.24.0"

  imagePullSecrets: []

  podAnnotations: {}

  podSecurityContext:
    fsGroup: 1000
    runAsUser: 1000
    runAsNonRoot: true

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL

  # IPFS initialization profile (server, lowpower, etc.)
  profile: server

  # Optional: Swarm key for private IPFS network
  # Optional: Kubernetes Secret name that contains the swarm key file.
  # If set, the chart will mount that Secret's `swarm.key` entry into the pod
  # at `/data/ipfs/swarm.key` and the init-container will use that file.
  # Example: swarmSecretName: ipfs-swarm-key
  swarmSecretName: ""

  # Optional: Peering configuration for private IPFS networks
  # When using a swarm key, IPFS nodes need explicit peer addresses to connect
  # Format: list of peer multiaddrs
  # Example:
  # peers:
  #   - /dns4/firefly-ipfs.transporter1-net.svc.cluster.local/tcp/4001/p2p/12D3KooW...
  #   - /dns4/firefly-ipfs.ombud1-net.svc.cluster.local/tcp/4001/p2p/12D3KooW...
  peers: []

  # API authentication credentials
  apiUsername: ""
  apiPassword: ""

  extraEnv: []
    # - name: IPFS_LOGGING
    #   value: debug

  service:
    type: ClusterIP
    apiPort: 5001
    gatewayPort: 8080
    swarmPort: 4001

  persistentVolume:
    accessModes:
      - ReadWriteOnce
    annotations: {}
    size: 10Gi
    storageClass: ""

  resources: {}
    # limits:
    #   cpu: 1000m
    #   memory: 1Gi
    # requests:
    #   cpu: 250m
    #   memory: 512Mi

  nodeSelector: {}

  tolerations: []

  affinity: {}
