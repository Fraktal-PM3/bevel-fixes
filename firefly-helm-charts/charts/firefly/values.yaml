# FabConnect configuration (Hyperledger Fabric connector)
# Enable this when using Fabric as the blockchain
fabconnect:
  enabled: false

  # Pod security context
  podSecurityContext:
    fsGroup: 1001
    runAsUser: 1001
    runAsNonRoot: true

  # Security context for the container
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001

  # FabConnect configuration
  config:
    # Automatically register and enroll the signer identity with Fabric CA
    #
    # CRITICAL: This value MUST match config.fabconnectSigner exactly
    # The deployment will fail validation if these don't match
    #
    # When enabled (non-empty), a Helm hook job will:
    #   1. Wait for Fabric CA to be available
    #   2. Register the identity with the CA
    #   3. Enroll the identity and retrieve certificates
    #   4. Create a status ConfigMap for tracking
    #
    # The FireFly pod will wait for this enrollment to complete before starting
    #
    # Best practice: Use the same naming convention as fabconnectSigner
    # Example: If fabconnectSigner is "transporter1-firefly", set this to "transporter1-firefly"
    #
    # Leave empty ("") to disable automatic enrollment (you must manually enroll the identity)
    autoEnrollIdentity: ""

  # Fabric network configuration
  fabric:
    # NOTE: Override these values for your specific Fabric network
    peerUrl: "grpcs://peer0.org1.example.com:7051"
    ordererUrl: "grpcs://orderer.example.com:7050"
    caUrl: "https://ca.org1.example.com:7054"
    organizationName: "org1.example.com"
    organizationMspId: "Org1MSP"
    channelName: "default-channel"
    chaincodeName: "firefly"
    enrollId: "admin"
    enrollSecret: "adminpw"

  # MSP secret configuration
  # You must create this secret containing your Fabric MSP credentials
  msp:
    secretName: "fabconnect-msp"
    mountPath: "/etc/firefly/organizations"

  # Service configuration
  service:
    type: ClusterIP
    port: 3000

  # Resource limits
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Persistent volume for receipts and events
  persistentVolume:
    size: 5Gi
    storageClass: ""

